name: Linux native runtime build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package_linux:
        description: Attempt the audited Linux package gate after the build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-runtime:
    if: >-
      github.repository == 'LucioFranco/orbiter-native' &&
      github.event.repository.private == false &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
      CARGO_HOME: ${{ github.workspace }}/.ci-cache/cargo
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Ubuntu build and desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config clang binutils zlib1g-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libvulkan-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Record toolchain
        run: |
          cmake --version
          clang++ --version
          rustc --version
          cargo --version
          ldd --version
      - name: Restore pinned public source downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .ci-cache/deps
            .ci-cache/cargo/registry
          key: linux-runtime-v1-${{ hashFiles('ci/inputs.json', 'orbiter/Src/WgpuClient/rust/Cargo.lock') }}
      - name: Retrieve and verify pinned inputs, including separate NASSP data
        run: python3 ci/fetch_inputs.py --nassp-data
      - name: Build host, NASSP modules and wgpu; run selected headless tests
        run: python3 ci/build_native.py --nassp
      - name: Collect bounded test reports
        id: collect_reports
        if: always()
        run: python3 ci/collect_reports.py --build orbiter/build/ci --scope linux-x64-native-nassp-wgpu-headless
      - name: Upload test reports
        if: always() && steps.collect_reports.outcome == 'success' && steps.collect_reports.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-linux-x64-native
          path: ${{ steps.collect_reports.outputs.directory }}
          retention-days: 7
          if-no-files-found: error
      - name: Stage audited Linux runtime and matching source
        if: github.event_name == 'workflow_dispatch' && inputs.package_linux == true
        run: python3 packaging/linux/package.py --build orbiter/build/ci --output linux-artifacts
      - name: Upload audited Linux runtime
        if: github.event_name == 'workflow_dispatch' && inputs.package_linux == true && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orbiter-native-linux-x64-${{ github.sha }}
          path: linux-artifacts/orbiter-native-linux-x64.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Save verified public downloads after trusted pushes
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .ci-cache/deps
            .ci-cache/cargo/registry
          key: linux-runtime-v1-${{ hashFiles('ci/inputs.json', 'orbiter/Src/WgpuClient/rust/Cargo.lock') }}
